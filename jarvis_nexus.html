<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. · Nexus</title>
<style>
  :root{
    --ground:#050409; --panel:rgba(18,14,32,.42); --edge:rgba(140,120,255,.22);
    --teal:#35f0d0; --violet:#8b6cff; --magenta:#ff5cae;
    --ink:#ece9ff; --dim:#7d7aa8; --dimmer:#4a4770;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:var(--ground); color:var(--ink);
    font-family:ui-sans-serif,"Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;}
  .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;}
  #scene{position:fixed; inset:0; z-index:0; display:block;}

  /* framing */
  .corner{position:fixed; width:54px; height:54px; z-index:3; pointer-events:none;
    border:1px solid var(--edge);}
  .corner.tl{top:22px; left:22px; border-right:0; border-bottom:0;}
  .corner.tr{top:22px; right:22px; border-left:0; border-bottom:0;}
  .corner.bl{bottom:22px; left:22px; border-right:0; border-top:0;}
  .corner.br{bottom:22px; right:22px; border-left:0; border-top:0;}

  /* wordmark */
  #brand{position:fixed; top:30px; left:44px; z-index:4;}
  #brand h1{font-size:15px; font-weight:600; letter-spacing:.42em;
    background:linear-gradient(90deg,var(--teal),var(--violet) 55%,var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  #brand .sub{font-size:10px; letter-spacing:.34em; color:var(--dim);
    text-transform:uppercase; margin-top:6px;}
  #stateline{margin-top:14px; font-size:11px; letter-spacing:.14em; color:var(--dim);
    text-transform:uppercase; display:flex; align-items:center; gap:8px;}
  #dot{width:8px; height:8px; border-radius:50%; background:var(--teal);
    box-shadow:0 0 10px var(--teal); transition:.3s;}

  /* clock */
  #clockwrap{position:fixed; top:30px; right:44px; z-index:4; text-align:right;}
  #clock{font-size:26px; letter-spacing:.06em; color:var(--ink); font-weight:300;
    font-variant-numeric:tabular-nums;}
  #date{font-size:11px; letter-spacing:.22em; color:var(--dim); text-transform:uppercase; margin-top:3px;}

  /* telemetry rail (glass) */
  .glass{background:var(--panel); border:1px solid var(--edge); border-radius:16px;
    -webkit-backdrop-filter:blur(14px) saturate(1.2); backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 8px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);}
  #rail{position:fixed; left:44px; bottom:120px; z-index:4; width:210px; padding:16px 18px;}
  #rail .lab{font-size:9.5px; letter-spacing:.26em; color:var(--dimmer); text-transform:uppercase;}
  .meter{margin:9px 0 14px;}
  .meter .row{display:flex; justify-content:space-between; font-size:11px; color:var(--dim);
    letter-spacing:.05em; margin-bottom:5px;}
  .meter .row b{color:var(--ink); font-weight:500;}
  .track{height:3px; border-radius:3px; background:rgba(140,120,255,.14); overflow:hidden;}
  .fill{height:100%; border-radius:3px;
    background:linear-gradient(90deg,var(--teal),var(--violet)); transition:width .6s ease;}

  /* subsystems */
  #subs{position:fixed; right:44px; bottom:120px; z-index:4; width:220px; padding:16px 18px; text-align:right;}
  #subs .lab{font-size:9.5px; letter-spacing:.26em; color:var(--dimmer); text-transform:uppercase; margin-bottom:10px;}
  .chip{display:inline-block; margin:3px; padding:3px 9px; font-size:9.5px; letter-spacing:.08em;
    border-radius:20px; border:1px solid var(--dimmer); color:var(--dim);}
  .chip.on{color:var(--teal); border-color:rgba(53,240,208,.5); box-shadow:0 0 10px rgba(53,240,208,.18);}

  /* status under core */
  #status{position:fixed; left:50%; top:calc(50% + 210px); transform:translateX(-50%); z-index:2;
    font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:var(--dim);
    text-align:center; min-height:18px; text-shadow:0 0 20px rgba(139,108,255,.4);}

  /* conversation */
  #log{position:fixed; z-index:3; left:50%; transform:translateX(-50%); bottom:172px;
    width:min(680px,84vw); max-height:30vh; overflow-y:auto; padding:4px;
    display:flex; flex-direction:column; gap:9px; pointer-events:auto; scrollbar-width:thin;}
  #log::-webkit-scrollbar{width:4px;} #log::-webkit-scrollbar-thumb{background:var(--dimmer); border-radius:4px;}
  .msg{max-width:82%; padding:10px 15px; font-size:14px; line-height:1.55; border-radius:14px;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); animation:rise .45s cubic-bezier(.2,.8,.2,1);}
  .msg .who{display:block; font-size:9px; letter-spacing:.2em; text-transform:uppercase;
    margin-bottom:3px; opacity:.75;}
  .msg.j{align-self:flex-start; background:rgba(28,22,52,.6); border:1px solid rgba(139,108,255,.35);
    color:#e9e6ff;} .msg.j .who{color:var(--violet);}
  .msg.u{align-self:flex-end; background:rgba(52,18,42,.55); border:1px solid rgba(255,92,174,.4);
    color:#ffe3f1; text-align:right;} .msg.u .who{color:var(--magenta);}
  @keyframes rise{from{opacity:0; transform:translateY(10px) scale(.98);}to{opacity:1;}}

  /* command bar */
  #bar{position:fixed; z-index:5; left:50%; transform:translateX(-50%); bottom:46px;
    display:flex; gap:12px; align-items:center; width:min(680px,84vw);}
  #input{flex:1; min-width:0; padding:15px 22px; font-size:15px; color:var(--ink);
    border-radius:30px; border:1px solid var(--edge); background:var(--panel);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); outline:none;}
  #input::placeholder{color:var(--dimmer);}
  #input:focus{border-color:rgba(139,108,255,.6); box-shadow:0 0 0 3px rgba(139,108,255,.12);}
  .btn{width:52px; height:52px; flex:0 0 auto; border-radius:50%; cursor:pointer;
    border:1px solid var(--edge); color:var(--ink); font-size:19px;
    display:flex; align-items:center; justify-content:center; transition:.2s;
    background:var(--panel); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);}
  #send{background:linear-gradient(135deg,var(--teal),var(--violet)); color:#0a0616; border:0;
    box-shadow:0 0 20px rgba(139,108,255,.4);}
  .btn:hover{transform:translateY(-1px); box-shadow:0 6px 24px rgba(139,108,255,.5);}
  .btn:focus-visible{outline:2px solid var(--magenta); outline-offset:3px;}
  #mic.rec{background:linear-gradient(135deg,var(--magenta),#ff8a5c); border:0; color:#1a0410;
    box-shadow:0 0 26px rgba(255,92,174,.6); animation:recpulse 1.1s ease-in-out infinite;}
  @keyframes recpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .hint{position:fixed; z-index:5; bottom:18px; left:50%; transform:translateX(-50%);
    font-size:10.5px; letter-spacing:.12em; color:var(--dimmer); text-align:center; width:90vw;}
  @media (prefers-reduced-motion: reduce){#mic.rec{animation:none;}}
</style>

<canvas id="scene"></canvas>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div id="brand">
  <h1>J.A.R.V.I.S.</h1>
  <div class="sub">Nexus Interface</div>
  <div id="stateline"><span id="dot"></span><span id="modeState">Standby</span></div>
</div>
<div id="clockwrap"><div id="clock" class="mono">--:--:--</div><div id="date">----</div></div>

<div id="rail" class="glass">
  <div class="lab">Core Telemetry</div>
  <div class="meter"><div class="row"><span>Cognition</span><b id="v1">98%</b></div><div class="track"><div class="fill" id="f1" style="width:98%"></div></div></div>
  <div class="meter"><div class="row"><span>Neural Flux</span><b id="v2">74%</b></div><div class="track"><div class="fill" id="f2" style="width:74%"></div></div></div>
  <div class="meter"><div class="row"><span>Uplink</span><b id="v3">SECURE</b></div><div class="track"><div class="fill" id="f3" style="width:100%"></div></div></div>
</div>

<div id="subs" class="glass">
  <div class="lab">Subsystems</div>
  <div id="caps"></div>
</div>

<div id="status">Initializing</div>
<div id="log"></div>

<div id="bar">
  <input id="input" type="text" aria-label="Command input" placeholder="Speak or type a command…  (try “briefing”, “roll a dice”, “help”)" autocomplete="off">
  <button class="btn" id="send" title="Send" aria-label="Send">&#10148;</button>
  <button class="btn" id="mic" title="Voice" aria-label="Voice">&#127908;</button>
</div>
<div class="hint">A living core — it breathes with your voice · press the mic and speak · say “help” for commands</div>

<script>
const $ = s => document.querySelector(s);
const NAME="Jarvis", TITLE="Sir";
const statusEl=$('#status'), logEl=$('#log'), dot=$('#dot');

/* =========================================================
   THE LIVING CORE  — 3D particle mind rendered in perspective
   ========================================================= */
const cv=$('#scene'), g=cv.getContext('2d');
let W,H,CX,CY,DPR=Math.min(devicePixelRatio||1,2);
function resize(){ W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  CX=W/2; CY=H/2; }
resize(); addEventListener('resize',resize);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TEAL=[53,240,208], VIOLET=[139,108,255], MAG=[255,92,174];
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

// Fibonacci sphere of points = the "mind"
const N=1300, pts=[];
const GA=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){
  const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), th=GA*i;
  pts.push({x:Math.cos(th)*r, y:y, z:Math.sin(th)*r, ph:Math.random()*Math.PI*2});
}
// tilted orbital rings
const rings=[{tilt:0.5,yaw:0.2,rad:1.55,seg:120,col:VIOLET},
             {tilt:-0.9,yaw:1.1,rad:1.85,seg:140,col:TEAL},
             {tilt:1.4,yaw:-0.6,rad:1.7,seg:130,col:MAG}];
// inward data-streams
const streams=[]; for(let i=0;i<70;i++) streams.push(newStream());
function newStream(){ const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=2.2+Math.random()*1.4;
  return {th,ph,r,rr:r,sp:0.006+Math.random()*0.012}; }

let ampNow=0.06, ampTarget=0.06, spin=0, tState='idle', pulse=0;
function coreColor(){ return tState==='speaking'?MAG : tState==='listening'?TEAL : VIOLET; }

function rot(p,ay,ax){
  let x=p.x*Math.cos(ay)+p.z*Math.sin(ay);
  let z=-p.x*Math.sin(ay)+p.z*Math.cos(ay);
  let y=p.y*Math.cos(ax)-z*Math.sin(ax);
  z=p.y*Math.sin(ax)+z*Math.cos(ax);
  return [x,y,z];
}
function project(x,y,z,scale){ const fov=3.2, per=fov/(fov+z); return [CX+x*per*scale, CY+y*per*scale, per]; }

let last=0;
function frame(ts){
  const dt=Math.min((ts-last)||16,50); last=ts;
  ampNow += (ampTarget-ampNow)*0.05;
  pulse += dt*0.004;
  if(!reduce) spin += dt*0.00016;
  const ax=Math.sin(spin*0.7)*0.5+0.35, ay=spin;
  const scale=Math.min(W,H)*0.17;

  // trails / fade
  g.globalCompositeOperation='source-over';
  g.fillStyle='rgba(5,4,9,0.32)'; g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';

  // central glow
  const cc=coreColor(), gr=g.createRadialGradient(CX,CY,0,CX,CY,scale*(1.1+ampNow*3));
  gr.addColorStop(0,`rgba(${cc[0]},${cc[1]},${cc[2]},${0.22+ampNow*0.9})`);
  gr.addColorStop(0.4,`rgba(${cc[0]},${cc[1]},${cc[2]},0.06)`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(CX,CY,scale*(1.1+ampNow*3),0,7); g.fill();

  // orbital rings
  for(const R of rings){
    g.beginPath();
    for(let s=0;s<=R.seg;s++){
      const a=(s/R.seg)*Math.PI*2;
      let x=Math.cos(a)*R.rad, y=Math.sin(a)*R.rad*0.34, z=Math.sin(a)*R.rad;
      // tilt
      let y2=y*Math.cos(R.tilt)-z*Math.sin(R.tilt), z2=y*Math.sin(R.tilt)+z*Math.cos(R.tilt);
      const P=rot({x:x*Math.cos(R.yaw)+z2*Math.sin(R.yaw), y:y2, z:-x*Math.sin(R.yaw)+z2*Math.cos(R.yaw)},ay,ax);
      const pr=project(P[0],P[1],P[2],scale);
      if(s===0) g.moveTo(pr[0],pr[1]); else g.lineTo(pr[0],pr[1]);
    }
    g.strokeStyle=`rgba(${R.col[0]},${R.col[1]},${R.col[2]},0.28)`; g.lineWidth=1.2*DPR; g.stroke();
  }

  // the mind — particle sphere
  const cA=tState==='speaking'?MAG:TEAL, cB=VIOLET;
  for(const p of pts){
    const breathe=1 + ampNow*(0.6+0.5*Math.sin(pulse*2+p.ph)) + (tState==='speaking'?Math.random()*ampNow*0.6:0);
    const P=rot({x:p.x*breathe,y:p.y*breathe,z:p.z*breathe},ay,ax);
    const pr=project(P[0],P[1],P[2],scale), depth=(P[2]+1.6)/3.2;
    const col=mix(cA,cB,(p.y+1)/2);
    const size=Math.max(0.4, pr[2]*1.7*DPR);
    g.globalAlpha=Math.max(0.05, Math.min(1, depth))*0.9;
    g.fillStyle=`rgb(${col[0]|0},${col[1]|0},${col[2]|0})`;
    g.beginPath(); g.arc(pr[0],pr[1],size,0,7); g.fill();
  }
  g.globalAlpha=1;

  // inward streams
  for(const s of streams){
    s.rr-=s.sp*(1+ampNow*6);
    if(s.rr<0.3){ Object.assign(s,newStream()); }
    const x=s.rr*Math.sin(s.ph)*Math.cos(s.th), y=s.rr*Math.cos(s.ph), z=s.rr*Math.sin(s.ph)*Math.sin(s.th);
    const P=rot({x,y,z},ay,ax), pr=project(P[0],P[1],P[2],scale);
    const t=1-(s.rr/s.r), col=coreColor();
    g.globalAlpha=Math.min(1,t)*0.8;
    g.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    g.beginPath(); g.arc(pr[0],pr[1],1.3*DPR,0,7); g.fill();
  }
  g.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- state ---------------- */
function setState(s,label){
  tState = (s==='speaking'||s==='listening')?s:'idle';
  ampTarget = s==='speaking'?0.30 : s==='listening'?0.16 : s==='processing'?0.11 : 0.06;
  const c = coreColor();
  dot.style.background=`rgb(${c[0]},${c[1]},${c[2]})`;
  dot.style.boxShadow=`0 0 12px rgb(${c[0]},${c[1]},${c[2]})`;
  $('#modeState').textContent = s==='processing'?'Processing' : s==='listening'?'Listening' : s==='speaking'?'Speaking' : 'Standby';
  statusEl.textContent = label || s.toUpperCase();
}
function addMsg(text,who){
  const d=document.createElement('div'); d.className='msg '+(who==='user'?'u':'j');
  const w=document.createElement('span'); w.className='who'; w.textContent=who==='user'?'You':NAME;
  d.appendChild(w); d.appendChild(document.createTextNode(text));
  logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight;
  while(logEl.children.length>30) logEl.removeChild(logEl.firstChild);
}

/* ---------------- speech ---------------- */
let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/uk english male|daniel|arthur|george/i.test(v.name))||vs.find(v=>v.lang==='en-GB')
    ||vs.find(v=>/male/i.test(v.name))||vs.find(v=>v.lang&&v.lang.startsWith('en'))||vs[0]; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }
function say(t){ return new Promise(res=>{ if(!('speechSynthesis' in window))return res();
  try{ const u=new SpeechSynthesisUtterance(t); if(voice)u.voice=voice; u.rate=1.02; u.pitch=.9;
    u.onend=res; u.onerror=res; speechSynthesis.speak(u);}catch(_){res();} }); }

/* ================= COMMAND ENGINE (in-browser) ================= */
const store={ get(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch(_){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}}};
const JOKES=["Why do programmers prefer dark mode? Because light attracts bugs.",
  "I told my computer I needed a break, and it said: no problem, I'll go to sleep.",
  "Why did the developer go broke? Because he used up all his cache.",
  "There are 10 kinds of people: those who understand binary and those who don't.",
  "A SQL query walks into a bar, walks up to two tables and asks: may I join you?"];
function extractNumber(t,d){ for(const x of String(t).replace(/:/g,' ').split(/\s+/)) if(/^\d+$/.test(x))return parseInt(x,10); return d; }
function safeMath(expr){ const words={'plus':'+','add':'+','minus':'-','subtract':'-','times':'*',
  'multiplied by':'*','into':'*','divided by':'/','over':'/','power':'**','mod':'%'};
  let e=String(expr).toLowerCase(); for(const w in words)e=e.split(w).join(words[w]);
  e=e.replace(/[^0-9+\-*/%.() ]/g,'').trim(); if(!e||!/\d/.test(e))return null;
  try{const v=Function('"use strict";return ('+e+')')(); return (typeof v==='number'&&isFinite(v))?v:null;}catch(_){return null;} }
function greetPart(){const h=new Date().getHours();return h<12?'Morning':h<18?'Afternoon':'Evening';}
let busy=false;
async function respond(lines){ for(const line of lines){ addMsg(line,'jarvis');
  setState('speaking', line.length>60?'SPEAKING':line.toUpperCase().slice(0,26)); await say(line);} }
function scheduleAnnounce(text,ms){ setTimeout(()=>{ addMsg(text,'jarvis'); if(!busy)say(text); },ms); }

async function processCommand(query){
  let q=(query||'').trim().toLowerCase();
  for(const w of ['hey jarvis','okay jarvis','jarvis']) if(q.startsWith(w)){q=q.slice(w.length).trim();break;}
  if(!q) return [];
  const has=s=>q.includes(s), tok=q.split(/\s+/);
  if(['exit','quit','goodbye','good bye'].some(has)) return [`Very good, ${TITLE}. Returning to standby.`];
  if(['help','what can you do','commands'].includes(q)) return [
    `Here is what I can do right here, ${TITLE}:`,
    "Info: time, date, weather in a city, define a word, my telemetry.",
    "Productivity: todo add, todo list, remind me, set a timer or an alarm, take a note.",
    "Fun & math: calculate, flip a coin, roll a dice, random number, generate a password, joke.",
    "Utilities: copy to clipboard, open a website. Or just ask me anything."];
  if((tok.includes('time')||has('what time')||has('the time'))&&!has('timer'))
    return [`${TITLE}, the time is ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`];
  if(tok.includes('date')||has('day is it')||q==='today')
    return [`Today is ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}`];
  if(['briefing','brief me','good morning','morning briefing','daily briefing'].includes(q)){
    const out=[`Good ${greetPart().toLowerCase()}, ${TITLE}. Here is your briefing.`,
      `It is ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}, ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}.`];
    const p=store.get('todos',[]).filter(t=>!t.done);
    out.push(p.length?`You have ${p.length} pending task${p.length>1?'s':''}. The first is: ${p[0].task}.`:"Your task list is clear.");
    out.push("That's your briefing. Have a productive day."); return out; }
  if(q.startsWith('open ')){ let t=q.slice(5).trim();
    const url=/^https?:\/\//.test(t)?t:(t.includes('.')&&!t.includes(' ')?'https://'+t:'https://www.google.com/search?q='+encodeURIComponent(t));
    try{window.open(url,'_blank');}catch(_){} return [`Opening ${t}.`]; }
  if(q.startsWith('todo add')||q.startsWith('add task')){ const item=q.replace('todo add','').replace('add task','').trim();
    if(!item)return["What task should I add?"]; const td=store.get('todos',[]); td.push({task:item,done:false}); store.set('todos',td);
    return [`Added to your to-do list: ${item}`]; }
  if(has('todo list')||has('to do list')||has('my tasks')){ const p=store.get('todos',[]).filter(t=>!t.done);
    if(!p.length)return["Your to-do list is empty."]; return [`You have ${p.length} pending task${p.length>1?'s':''}:`,...p.map((t,i)=>`${i+1}. ${t.task}`)]; }
  if(q.startsWith('complete task')||q.startsWith('done task')||q.startsWith('finish task')){
    const idx=extractNumber(q,1),td=store.get('todos',[]),p=td.filter(t=>!t.done);
    if(idx>=1&&idx<=p.length){p[idx-1].done=true;store.set('todos',td);return[`Marked '${p[idx-1].task}' as done.`];} return["That task number doesn't exist."]; }
  if(q.startsWith('take a note')||q.startsWith('note ')||q.startsWith('remember ')){
    const text=q.replace('take a note','').replace(/^note /,'').replace(/^remember /,'').trim();
    if(!text)return["What should I note down?"]; const n=store.get('notes',[]); n.push({t:new Date().toLocaleString(),text}); store.set('notes',n); return["Note added."]; }
  if(q.startsWith('remind me')){ let body=q.includes('to')?q.split('to').slice(1).join('to'):q,mins=5,text=body;
    if(body.includes(' in ')){const pp=body.split(' in ');text=pp.slice(0,-1).join(' in ');mins=extractNumber(pp[pp.length-1],5);}
    text=text.trim(); scheduleAnnounce(`Reminder, ${TITLE}: ${text}`,mins*60000); return [`I'll remind you to ${text} in ${mins} minute${mins!==1?'s':''}.`]; }
  if(has('set timer')||has('start timer')){ let s=extractNumber(q,60); if(has('minute'))s*=60;
    scheduleAnnounce(`${TITLE}, your ${s} second timer is up.`,s*1000); return [`Timer set for ${s} seconds.`]; }
  if(has('alarm')){ const when=(q.split('for')[1]||'').trim(), m=when.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
    if(!m)return["Try something like: set an alarm for 7:30 am."]; let h=+m[1],mn=m[2]?+m[2]:0,ap=m[3];
    if(ap==='pm'&&h<12)h+=12; if(ap==='am'&&h===12)h=0; const now=new Date(),tg=new Date(); tg.setHours(h,mn,0,0);
    if(tg<=now)tg.setDate(tg.getDate()+1); scheduleAnnounce(`${TITLE}, this is your alarm.`,tg-now);
    return [`Alarm set for ${tg.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}.`]; }
  if(q.startsWith('calculate')||q.startsWith("what's")||q.startsWith('what is')||
     (['plus','minus','times','divided by','multiplied'].some(has)&&/\d/.test(q))){
    const r=safeMath(q.replace('calculate','').replace("what's",'').replace('what is','').trim()||q);
    return r!==null?[`The answer is ${r}`]:["I couldn't calculate that. Try: calculate 15 times 12."]; }
  if(has('flip a coin')||has('flip coin')||has('toss a coin')) return [Math.random()<.5?'Heads':'Tails'];
  if(has('roll a dice')||has('roll dice')||has('roll a die')) return [`You rolled a ${1+Math.floor(Math.random()*6)}`];
  if(has('random number')) return [`Your random number is ${1+Math.floor(Math.random()*100)}`];
  if(has('generate')&&has('password')){ const n=extractNumber(q,16),ch="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
    let p=''; for(let i=0;i<n;i++)p+=ch[Math.floor(Math.random()*ch.length)]; addMsg('🔑 '+p,'jarvis');
    return [`I've generated a ${n} character password — it's shown above. Keep it somewhere safe.`]; }
  if(has('joke')) return [JOKES[Math.floor(Math.random()*JOKES.length)]];
  if(has('telemetry')||has('system stat')||has('system info')||has('cpu')||has('battery')){ const out=[];
    if(navigator.deviceMemory)out.push(`This device reports about ${navigator.deviceMemory} gigabytes of memory`);
    if(navigator.hardwareConcurrency)out.push(`and ${navigator.hardwareConcurrency} logical cores`);
    try{if(navigator.getBattery){const b=await navigator.getBattery();out.push(`Battery is at ${Math.round(b.level*100)} percent and ${b.charging?'charging':'discharging'}`);}}catch(_){}
    return out.length?out:["All core systems nominal, "+TITLE+"."]; }
  if(q.startsWith('copy ')&&has('clipboard')){ const text=q.slice(5).replace('to the clipboard','').replace('to clipboard','').trim();
    try{await navigator.clipboard.writeText(text);return["Copied to your clipboard."];}catch(_){return["I couldn't reach the clipboard in this browser."];} }
  if(has('weather')) return ["Live weather runs in the full desktop edition, which connects to a weather service with your API key."];
  if(q.startsWith('define ')||has('definition of')) return ["Dictionary look-ups run in the full desktop edition."];
  if(has('news')||has('headlines')) return ["Live news runs in the full desktop edition."];
  if(has('convert')&&has('to')) return ["Currency conversion runs in the full desktop edition with live rates."];
  if(q.startsWith('translate')) return ["Translation runs in the full desktop edition, powered by the AI model."];
  if(q.startsWith('play ')){ const s=q.slice(5).replace('on youtube','').replace('on spotify','').trim();
    try{window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(s),'_blank');}catch(_){} return [`Here are results for ${s}.`]; }
  return [`I can't answer that one in this browser demo, ${TITLE} — the full desktop edition adds an AI brain that can. Say "help" for what I do right here.`];
}

async function send(query){ query=(query||'').trim(); if(!query||busy)return;
  busy=true; addMsg(query,'user'); $('#input').value=''; setState('processing','PROCESSING');
  try{ await respond(await processCommand(query)); }catch(e){ addMsg('A subsystem faulted, but I recovered.','jarvis'); }
  setState('idle','STANDBY'); busy=false; $('#input').focus(); }

/* ---------------- voice input ---------------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null,recging=false;
if(SR){ rec=new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onstart=()=>{recging=true;$('#mic').classList.add('rec');setState('listening','LISTENING');};
  rec.onend=()=>{recging=false;$('#mic').classList.remove('rec');if(!busy)setState('idle','STANDBY');};
  rec.onerror=e=>{recging=false;$('#mic').classList.remove('rec'); if(e&&e.error==='not-allowed')addMsg('Microphone access was blocked. You can still type to me.','jarvis');};
  rec.onresult=e=>send(e.results[0][0].transcript); }
$('#mic').onclick=()=>{ if(!SR){addMsg('Voice input needs Chrome or Edge. You can still type to me.','jarvis');return;}
  if(recging)rec.stop(); else{ try{speechSynthesis.cancel();rec.start();}catch(_){} } };
$('#send').onclick=()=>send($('#input').value);
$('#input').addEventListener('keydown',e=>{ if(e.key==='Enter')send($('#input').value); });

/* ---------------- clock / telemetry / caps ---------------- */
function tick(){ const n=new Date();
  $('#clock').textContent=n.toLocaleTimeString();
  $('#date').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  const c=(88+Math.random()*10)|0, f=(60+Math.random()*30)|0;
  $('#v1').textContent=c+'%'; $('#f1').style.width=c+'%';
  $('#v2').textContent=f+'%'; $('#f2').style.width=f+'%'; }
setInterval(tick,1200); tick();
(function caps(){ const L={Voice:'speechSynthesis' in window,Mic:!!SR,Clock:true,Tasks:true,
  Math:true,Clipboard:!!navigator.clipboard,Telemetry:!!navigator.hardwareConcurrency,Timers:true};
  const box=$('#caps'); for(const k in L){const s=document.createElement('span');
    s.className='chip '+(L[k]?'on':''); s.textContent=k; box.appendChild(s);} })();

setTimeout(()=>{ setState('idle','STANDBY'); $('#input').focus();
  addMsg(`Good ${greetPart().toLowerCase()}, ${TITLE}. The Nexus core is online. Say "help", or press the mic.`,'jarvis'); },1300);
</script>
